<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fdeef1">
<meta name="robots" content="noindex">
<title>Birthday Surprise Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Parisienne&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-css">
:root{
  --cream:#fffaf6; --blush:#fdecef; --rose:#e9a0ac; --rose-2:#d97b8d; --rose-deep:#b4536b;
  --plum:#4d2838; --muted:#8c6673; --gold:#c9a36b; --lav:#efe7fb; --paper:#fffdf9;
  --line:rgba(180,83,107,.18); --shadow:0 18px 40px -18px rgba(120,40,70,.38);
  --script:'Parisienne',cursive; --serif:'Cormorant Garamond',Georgia,serif; --ui:'Quicksand',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;font-family:var(--ui);color:var(--plum);line-height:1.55;min-height:100vh;overflow-x:hidden;
  background:
    radial-gradient(1100px 600px at 8% -8%,#ffe1e7 0%,rgba(255,225,231,0) 60%),
    radial-gradient(900px 620px at 108% 18%,#efe3fb 0%,rgba(239,227,251,0) 55%),
    linear-gradient(180deg,#fff8f4 0%,#fdeef1 52%,#f8edf5 100%);
  background-attachment:fixed;
}
body.ed-open,body.gated,body.modal-open{overflow:hidden}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
img{max-width:100%}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}
#fx{z-index:70}
#app{position:relative;z-index:1}
body.is-owner #app{padding-top:58px}

.script{font-family:var(--script);font-weight:400}
.serif{font-family:var(--serif)}
.eyebrow{font-family:var(--ui);text-transform:uppercase;letter-spacing:.28em;font-size:.72rem;color:var(--rose-deep);font-weight:700;margin:0 0 10px}
.section{position:relative;max-width:820px;margin:0 auto;padding:84px 22px;text-align:center}
.sec-title{font-family:var(--script);font-size:clamp(2.5rem,8.5vw,3.6rem);color:var(--rose-deep);margin:0;line-height:1.1;font-weight:400}
.sec-sub{color:var(--muted);margin:8px auto 0;max-width:460px}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--rose);margin:0 auto;max-width:220px}
.orn::before,.orn::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(217,123,141,0),rgba(217,123,141,.6),rgba(217,123,141,0))}
.orn svg{width:14px;height:14px}

.reveal{opacity:0;transform:translateY(22px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

/* ---------- center messages / loader ---------- */
.center-msg{min-height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px;gap:10px}
.center-msg h1{font-family:var(--script);font-weight:400;color:var(--rose-deep);font-size:clamp(2.4rem,9vw,3.4rem);margin:0;line-height:1.1}
.center-msg p{color:var(--muted);max-width:420px;margin:0}
.beat{width:46px;height:46px;color:var(--rose-2);animation:beat 1.3s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}45%{transform:scale(.96)}60%{transform:scale(1.1)}}

/* ---------- countdown ---------- */
.cd-hero{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px 30px}
.cd-title{font-size:clamp(2.7rem,10vw,4.8rem);color:var(--rose-deep);margin:0 0 26px;line-height:1.08;max-width:760px}
.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(460px,100%)}
.t-unit{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:18px;padding:14px 4px 10px;box-shadow:0 10px 30px -18px rgba(120,40,70,.45);backdrop-filter:blur(4px)}
.t-num{display:block;font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,8vw,2.7rem);line-height:1;color:var(--plum);font-variant-numeric:lining-nums tabular-nums}
.t-lab{display:block;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:6px;font-weight:600}
.cd-until{margin:18px 0 0;font-family:var(--serif);font-style:italic;font-size:1.25rem;color:var(--muted)}
.scroll-hint{margin-top:44px;color:var(--rose-2);font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:6px;animation:bob 2.4s ease-in-out infinite}
.scroll-hint svg{width:18px;height:18px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

/* ---------- envelopes ---------- */
.env-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:26px 18px;margin-top:34px;text-align:center}
.env{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;position:relative;transition:transform .35s cubic-bezier(.2,.7,.2,1);-webkit-tap-highlight-color:transparent}
.env:focus-visible{outline:2px solid var(--rose-2);outline-offset:6px;border-radius:12px}
.env:hover{transform:translateY(-5px) rotate(-1.2deg)}
.env-body{position:relative;width:100%;aspect-ratio:4/3;border-radius:10px;background:#f1bcc7;box-shadow:0 14px 26px -14px rgba(140,50,80,.55);overflow:hidden}
.env-body::before{content:'';position:absolute;inset:0;background:#f8d5dc;clip-path:polygon(0 100%,0 4%,50% 60%,100% 4%,100% 100%)}
.env-flap{position:absolute;left:0;right:0;top:0;height:62%;background:linear-gradient(180deg,#eeadba,#e99fae);clip-path:polygon(0 0,100% 0,50% 100%)}
.env-seal{position:absolute;left:50%;top:60%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e3889c,#a63e59 72%);color:#fff;display:grid;place-items:center;box-shadow:0 3px 8px rgba(120,30,60,.35),inset 0 0 0 3px rgba(255,255,255,.12)}
.env-seal svg{width:16px;height:16px}
.is-locked .env-body{background:#e6d9dc}
.is-locked .env-body::before{background:#f2e9eb}
.is-locked .env-flap{background:linear-gradient(180deg,#e4d4d8,#dccbd0)}
.is-locked .env-seal{background:radial-gradient(circle at 35% 30%,#d2bcc3,#9d8088 72%)}
.is-locked .env-day{color:var(--muted)}
.is-new .env-body{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 14px 26px -14px rgba(140,50,80,.55),0 0 0 0 rgba(217,123,141,0)}50%{box-shadow:0 14px 26px -14px rgba(140,50,80,.55),0 0 0 8px rgba(217,123,141,.22)}}
.env-ribbon{position:absolute;top:-9px;right:-6px;z-index:2;background:var(--rose-deep);color:#fff;font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:99px;box-shadow:0 6px 14px -6px rgba(140,40,70,.6)}
.env-day{font-family:var(--serif);font-weight:600;font-size:1.2rem;margin-top:12px;line-height:1.2;font-variant-numeric:lining-nums}
.env-when{font-size:.8rem;color:var(--muted)}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-2deg)}40%{transform:translateX(6px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.finale-lock{margin:70px auto 0;max-width:420px;background:rgba(255,255,255,.65);border:1px dashed rgba(180,83,107,.35);border-radius:24px;padding:30px 24px}
.finale-lock .gift{width:54px;height:54px;color:var(--rose-2);margin:0 auto 6px}
.finale-lock h3{font-family:var(--script);font-weight:400;font-size:2.3rem;color:var(--rose-deep);margin:0;line-height:1.1}
.finale-lock p{margin:6px 0 0;color:var(--muted)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:65;background:rgba(77,40,56,.34);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px;opacity:0;pointer-events:none;transition:opacity .35s}
.modal.show{opacity:1;pointer-events:auto}
.modal-card{position:relative;width:min(540px,100%);max-height:88vh;overflow:auto;background:var(--paper);border-radius:24px;padding:34px 26px 30px;box-shadow:0 30px 70px -20px rgba(80,20,45,.5);transform:translateY(24px) scale(.96);transition:transform .45s cubic-bezier(.2,.8,.2,1);text-align:center}
.modal.show .modal-card{transform:none}
.modal-card::before{content:'';position:absolute;inset:10px;border:1px solid rgba(201,163,107,.35);border-radius:18px;pointer-events:none}
.m-close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:0;background:var(--blush);color:var(--rose-deep);cursor:pointer;display:grid;place-items:center;z-index:2}
.m-close svg{width:18px;height:18px}
.m-eyebrow{font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--rose-deep);font-weight:700}
.m-title{font-family:var(--script);font-size:clamp(2.2rem,8vw,2.8rem);color:var(--rose-deep);margin:4px 0 14px;line-height:1.12;font-weight:400}
.m-photo{margin:0 0 16px}
.m-photo img{display:block;width:100%;max-height:52vh;object-fit:cover;border-radius:14px;box-shadow:0 14px 30px -18px rgba(80,20,45,.6)}
.m-msg{font-family:var(--serif);font-size:1.28rem;line-height:1.55;white-space:pre-line;margin:0;color:var(--plum)}
.m-empty{color:var(--muted);font-style:italic}

/* ---------- gate ---------- */
.gate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,#fff7f5 0%,#fde3e9 60%,#f6dbe8 100%);transition:opacity .9s ease,transform .9s ease}
.gate.bye{opacity:0;transform:scale(1.06);pointer-events:none}
.gate h1{font-family:var(--script);font-weight:400;font-size:clamp(2.8rem,11vw,4.6rem);color:var(--rose-deep);margin:0 0 30px;line-height:1.08}
.gate-btn{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;padding:16px 30px;border-radius:999px;color:#fff;font-weight:700;font-size:1rem;letter-spacing:.02em;background:linear-gradient(135deg,#e58b9c,#bd566f);box-shadow:0 18px 34px -12px rgba(189,86,111,.75);animation:pulse 2.2s ease-in-out infinite}
.gate-btn svg{width:20px;height:20px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* ---------- party hero ---------- */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 22px 40px}
.hero-photo{position:relative;width:min(270px,68vw);aspect-ratio:4/5;margin-bottom:26px}
.hero-photo .frame{position:absolute;inset:0;border-radius:999px 999px 26px 26px;overflow:hidden;border:7px solid #fff;box-shadow:var(--shadow)}
.hero-photo img{width:100%;height:100%;object-fit:cover;display:block}
.hero-photo .h1,.hero-photo .h2,.hero-photo .h3{position:absolute;color:var(--rose-2);animation:float 5s ease-in-out infinite}
.hero-photo .h1{width:30px;left:-22px;top:18%}
.hero-photo .h2{width:20px;right:-16px;top:8%;animation-delay:-1.6s;color:var(--rose)}
.hero-photo .h3{width:24px;right:-24px;bottom:22%;animation-delay:-3s;color:var(--gold)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-12px) rotate(6deg)}}
.medallion{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,#fbe1e7);box-shadow:var(--shadow);color:var(--rose-2);margin-bottom:26px;border:6px solid #fff}
.medallion svg{width:62px;height:62px;animation:beat 1.6s ease-in-out infinite}
.hero-title{font-size:clamp(3rem,12vw,5.8rem);color:var(--rose-deep);margin:0;line-height:1.04;max-width:820px;text-shadow:0 2px 0 rgba(255,255,255,.6)}
.intro{font-family:var(--serif);font-size:clamp(1.2rem,4.2vw,1.45rem);max-width:580px;margin:22px auto 0;white-space:pre-line;color:var(--plum)}

/* ---------- cake ---------- */
.cake-wrap{position:relative;width:min(340px,86vw);aspect-ratio:300/260;margin:34px auto 0}
.cake-wrap>svg{position:absolute;inset:0;width:100%;height:100%}
.candle{position:absolute;width:2.5%;height:15.5%;transform:translateX(-50%);border:0;padding:0;cursor:pointer;border-radius:3px 3px 2px 2px;background:repeating-linear-gradient(160deg,#fff 0 4px,#f2a2b1 4px 8px);box-shadow:inset -1px 0 0 rgba(0,0,0,.06);-webkit-tap-highlight-color:transparent}
.candle::before{content:'';position:absolute;inset:-26px -5px -6px -5px}
.candle::after{content:'';position:absolute;left:50%;top:-5px;width:1.5px;height:6px;margin-left:-.75px;background:#5b3a3a;border-radius:1px}
.candle.back{z-index:1}.candle.front{z-index:2}
.flame{position:absolute;left:50%;bottom:100%;width:11px;height:20px;margin:0 0 3px -5.5px;border-radius:50% 50% 45% 45%/62% 62% 38% 38%;background:radial-gradient(ellipse at 50% 72%,#fffbe0 0%,#ffe08a 30%,#ffab45 64%,rgba(255,140,60,0) 100%);box-shadow:0 0 16px 5px rgba(255,196,100,.5);transform-origin:50% 90%;animation:flicker .14s ease-in-out infinite alternate;transition:transform .25s,opacity .25s}
@keyframes flicker{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.94,1.06) rotate(2deg)}}
.candle.out .flame{animation:none;transform:scale(0);opacity:0}
.smoke{position:absolute;left:50%;bottom:100%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:rgba(150,130,140,.55);opacity:0;pointer-events:none}
.candle.out .smoke{animation:smoke 1.6s ease-out forwards}
@keyframes smoke{0%{opacity:.7;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-46px) translateX(6px) scale(3.2)}}
.cake-actions{margin-top:22px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.wish{max-width:480px;margin:0 auto;opacity:0;max-height:0;overflow:hidden;transform:translateY(12px);transition:opacity .9s,transform .9s,max-height .9s,margin .9s}
.wish.show{opacity:1;max-height:600px;transform:none;margin-top:26px}
.wish .card{background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:22px;padding:22px 22px 24px;box-shadow:var(--shadow)}
.wish .script{font-size:2.2rem;color:var(--rose-deep);margin:0;line-height:1.1}
.wish p.txt{font-family:var(--serif);font-size:1.28rem;margin:8px 0 0;white-space:pre-line}

/* ---------- timeline ---------- */
.timeline{position:relative;margin-top:40px;text-align:left}
.timeline::before{content:'';position:absolute;left:17px;top:6px;bottom:6px;border-left:2px dashed rgba(196,90,115,.32)}
.tl-item{position:relative;padding-left:50px;margin-bottom:46px}
.tl-dot{position:absolute;left:7px;top:2px;width:22px;height:22px;color:var(--rose-2);background:#fff4f5;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 4px #fff4f5}
.tl-dot svg{width:14px;height:14px}
.tl-when{display:inline-block;background:#fff;border:1px solid var(--line);color:var(--rose-deep);font-size:.78rem;font-weight:700;letter-spacing:.04em;padding:4px 13px;border-radius:99px;margin-bottom:14px}
.polaroid{position:relative;display:inline-block;max-width:min(340px,100%);background:#fff;padding:10px 10px 12px;border-radius:4px;box-shadow:0 18px 34px -20px rgba(80,20,45,.6);transform:rotate(var(--tilt,0deg));margin:4px 0 0}
.polaroid::before{content:'';position:absolute;top:-11px;left:50%;width:76px;height:22px;margin-left:-38px;background:rgba(233,160,172,.55);transform:rotate(-4deg);border-radius:2px}
.polaroid img{display:block;width:100%;max-height:380px;object-fit:cover;border-radius:2px}
.tl-cap{font-family:var(--serif);font-size:1.24rem;margin:14px 0 0;white-space:pre-line}
@media (min-width:760px){
  .timeline::before{left:50%;margin-left:-1px}
  .tl-item{width:50%;padding-left:0;padding-right:52px;text-align:right}
  .tl-item.right{margin-left:50%;padding-right:0;padding-left:52px;text-align:left}
  .tl-item .tl-dot{left:auto;right:-11px}
  .tl-item.right .tl-dot{right:auto;left:-11px}
}

/* ---------- letter ---------- */
.letter-stage{padding-top:150px}
.letter-env{all:unset;box-sizing:border-box;position:relative;display:block;width:min(340px,84vw);aspect-ratio:3/2;margin:0 auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.letter-env:focus-visible{outline:2px solid var(--rose-2);outline-offset:8px;border-radius:10px}
.le-back{position:absolute;inset:0;background:#e59eac;border-radius:10px;box-shadow:0 22px 40px -20px rgba(120,30,60,.6)}
.le-paper{position:absolute;left:7%;right:7%;top:7%;height:86%;background:var(--paper);border-radius:6px;z-index:1;display:grid;place-items:center;transition:transform 1s cubic-bezier(.2,.8,.2,1) .35s;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.le-paper span{font-family:var(--script);color:var(--rose-deep);font-size:1.8rem;opacity:.85;margin-top:-30%}
.le-front{position:absolute;inset:0;z-index:2;background:#f5c0ca;clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);border-radius:10px}
.le-flap{position:absolute;left:0;right:0;top:0;height:58%;z-index:3;background:linear-gradient(180deg,#eeacb9,#e8a0ae);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .7s ease,z-index 0s .35s}
.le-seal{position:absolute;left:50%;top:56%;width:50px;height:50px;margin:-25px 0 0 -25px;z-index:4;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e3889c,#a63e59 72%);color:#fff;display:grid;place-items:center;box-shadow:0 4px 10px rgba(120,30,60,.4),inset 0 0 0 4px rgba(255,255,255,.12);transition:opacity .3s,transform .3s}
.le-seal svg{width:22px;height:22px}
.letter-env.open .le-flap{transform:rotateX(180deg);z-index:0}
.letter-env.open .le-seal{opacity:0;transform:scale(.6)}
.letter-env.open .le-paper{transform:translateY(-58%)}
.letter-hint{margin-top:18px;color:var(--muted);font-size:.86rem;letter-spacing:.12em;text-transform:uppercase}
.letter-full{display:none;max-width:620px;margin:40px auto 0;text-align:left;background-color:var(--paper);border-radius:16px;padding:34px 30px 30px;box-shadow:var(--shadow);position:relative}
.letter-full::before{content:'';position:absolute;inset:10px;border:1px solid rgba(201,163,107,.32);border-radius:10px;pointer-events:none}
.letter-full.show{display:block;animation:fadeUp 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.letter-to,.letter-sign{font-family:var(--script);color:var(--rose-deep);font-size:2.1rem;margin:0;line-height:1.3}
.letter-sign{text-align:right;margin-top:18px}
.letter-body{font-family:var(--serif);font-size:1.3rem;line-height:36px;white-space:pre-line;margin:8px 0 0;background-image:repeating-linear-gradient(transparent 0 35px,rgba(180,83,107,.12) 35px 36px)}

.footer{text-align:center;padding:30px 20px 110px;color:var(--muted);font-size:.9rem}
.footer .script{font-size:1.9rem;color:var(--rose-deep);display:block;line-height:1.2}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--ui);font-weight:600;font-size:.92rem;border-radius:999px;padding:10px 18px;border:1px solid #e7c3cb;background:#fff;color:var(--rose-deep);cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s;-webkit-tap-highlight-color:transparent;text-decoration:none;line-height:1.2}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -10px rgba(140,40,70,.5)}
.btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
.btn.primary{background:linear-gradient(135deg,#e08a9b,#bd566f);color:#fff;border-color:transparent}
.btn.small{padding:7px 13px;font-size:.82rem}
.btn svg{width:16px;height:16px}

/* ---------- music button / toast ---------- */
.music-btn{position:fixed;right:16px;bottom:16px;z-index:55;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);color:var(--rose-deep);display:grid;place-items:center;cursor:pointer;box-shadow:0 12px 26px -12px rgba(120,40,70,.55);backdrop-filter:blur(6px)}
.music-btn svg{width:22px;height:22px}
.music-btn.playing::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(217,123,141,.45);animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
.music-btn[hidden]{display:none}

    var f = fileIn.files && fileIn.files[0]; fileIn.value = ''; if (!f) return;
    if (f.size > MAX_AUDIO){ toast('Please pick a song under 12 MB'); return; }
    status.textContent = 'Uploading ' + f.name + '…';
    try {
      var r = await store.uploadAudio(f);
      m.kind = 'upload'; m.ref = r.ref; m.mime = r.mime; m.name = r.name; S.config.music = m; store.saveConfig(S.config);
      Music.reset(); status.textContent = 'Added ' + f.name + ' (' + fmtBytes(f.size) + ').';
    } catch (e) { status.textContent = ''; toast(errMsg(e)); }
    draw();
  });
  var prev = el('button', { class: 'btn', type: 'button', html: ICON.note + '<span>Play / pause preview</span>', onclick: function(){ Music.toggle(); } });
  box.appendChild(cards); box.appendChild(fileIn); box.appendChild(status);
  box.appendChild(el('div', { class: 'ed-actions' }, prev));
  draw();
}

function checklistCard(){
  var c = S.config, bday = parseDay(c.birthday);
  var checks = [
    [!!c.toName, c.toName ? 'For ' + c.toName : 'Their name'],
    [!!bday, bday ? 'Birthday on ' + fmtLong(bday) : 'Birthday date'],
    [S.days.length > 0, S.days.length ? plural(S.days.length, 'daily envelope') + (bday ? ', first opens ' + fmt(addDays(bday, -Math.max.apply(null, S.days.map(function(d){ return d.daysBefore; })))) : '') : 'Daily envelopes'],
    [S.memories.length > 0, S.memories.length ? plural(S.memories.length, 'memory').replace('memorys', 'memories') : 'Memories'],
    [!!c.cardMessage, c.cardMessage ? 'Letter written' : 'Letter'],
    [true, c.music.kind === 'none' ? 'No music' : (c.music.kind === 'upload' && c.music.ref ? 'Song: ' + (c.music.name || 'your upload') : 'Music box melody')]
  ];
  var ul = el('ul', { class: 'checklist' });
  checks.forEach(function(k){ ul.appendChild(el('li', {}, el('span', { class: 'ck' + (k[0] ? ' ok' : ''), text: k[0] ? '✓' : '·' }), k[1])); });
  return el('div', { class: 'ed-card' }, el('span', { class: 'f-label', text: 'Before you send' }), ul);
}
function saveBlob(name, blob){
  var url = URL.createObjectURL(blob), a = el('a', { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
function loadJSZip(){
  if (window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise(function(res, rej){
    var sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    sc.onload = function(){ window.JSZip ? res(window.JSZip) : rej(new Error('zip tool didn’t load')); };
    sc.onerror = function(){ rej(new Error('couldn’t load the zip tool, check your connection')); };
    document.head.appendChild(sc);
  });
}
function tabPublish(box){
  var info = repoInfo(), ex = serializeContent(S);
  var nPhotos = ex.files.filter(function(f){ return /^images\//.test(f.path); }).length, hasSong = ex.files.some(function(f){ return /^music\//.test(f.path); });
  box.appendChild(el('h2', { class: 'ed-h', text: 'Publish to GitHub' }));
  box.appendChild(checklistCard());
  var status = el('p', { class: 'dl-status', 'aria-live': 'polite' });
  var what = 'content.txt' + (nPhotos ? ' + ' + plural(nPhotos, 'photo') : '') + (hasSong ? ' + your song' : '');
  var folders = (nPhotos ? ['images'] : []).concat(hasSong ? ['music'] : []);
  var dl = el('button', { class: 'btn primary', type: 'button', html: ICON.download + '<span>' + (ex.files.length ? 'Download update (.zip)' : 'Download content.txt') + '</span>' });
  dl.addEventListener('click', async function(){
    dl.disabled = true; status.textContent = 'Preparing…';
    try {
      await store.flush();
      var cur = serializeContent(S);
      if (!cur.files.length){ saveBlob('content.txt', new Blob([cur.text], { type: 'text/plain' })); status.textContent = 'Downloaded content.txt.'; }
      else {
        var JSZip = await loadJSZip(), zip = new JSZip();
        zip.file('content.txt', cur.text);
        cur.files.forEach(function(f){ zip.file(f.path, f.ref.split(',')[1], { base64: true }); });
        var blob = await zip.generateAsync({ type: 'blob' });
        saveBlob('birthday-update.zip', blob);
        status.textContent = 'Downloaded birthday-update.zip (' + fmtBytes(blob.size) + ').';
      }
      store.markExported(cur.text);
    } catch (e) { status.textContent = 'Couldn’t prepare the download: ' + errMsg(e); }
    dl.disabled = false;
  });
  var cp = el('button', { class: 'btn', type: 'button', text: 'Copy content.txt text' });
  cp.addEventListener('click', function(){
    var t = serializeContent(S).text;
    Promise.resolve(navigator.clipboard && navigator.clipboard.writeText(t)).then(function(){ toast('Copied. Paste it into content.txt on GitHub'); store.markExported(t); }, function(){ toast('Couldn’t copy here. Use the download instead'); });
  });
  var link = function(href, text){ return href ? el('a', { href: href, target: '_blank', rel: 'noopener', text: text }) : text; };
  box.appendChild(el('div', { class: 'ed-card', style: 'padding-bottom:16px' },
    el('span', { class: 'f-label', text: 'Your update: ' + what }),
    el('ol', { class: 'steps' },
      el('li', {}, 'Download the update' + (ex.files.length ? ' and unzip it.' : '.')),
      el('li', {}, 'Open ', link(info && info.upload, 'your repository’s upload page'), ' and drag in content.txt' + (folders.length ? ' and the ' + folders.join(' and ') + ' folder' + (folders.length > 1 ? 's' : '') : '') + '. Press Commit changes.'),
      el('li', {}, 'About a minute later, open ', link(info && info.site, 'the live page'), ' (reload if it still shows the old version).')),
    el('div', { class: 'ed-actions', style: 'margin-top:14px' }, dl, cp), status,
    el('p', { class: 'f-hint' }, 'Only changed some words? Tap Copy, open ', link(info && info.editContent, 'content.txt on GitHub'), ', select all, paste, and Commit changes.')));
  box.appendChild(el('div', { class: 'ed-card', style: 'padding-bottom:16px' },
    el('span', { class: 'f-label', text: 'Start over' }),
    el('p', { style: 'margin:0 0 10px' , text: 'Throw away this browser’s draft and reload what’s live on GitHub.' }),
    el('button', { class: 'btn small', type: 'button', text: 'Discard draft', onclick: function(){ store.useLive(); } })));
}
function tabShare(box){
  if (store.kind === 'repo-edit') return tabPublish(box);
  box.appendChild(el('h2', { class: 'ed-h', text: 'Send it' }));
  box.appendChild(checklistCard());

  var status = el('p', { class: 'dl-status', 'aria-live': 'polite' });
  var btn = el('button', { class: 'btn primary', type: 'button', html: ICON.download + '<span>Download the birthday page</span>' });
  btn.addEventListener('click', function(){ downloadPage(btn, status); });
  box.appendChild(el('div', { class: 'ed-card', style: 'padding-bottom:16px' },
    el('span', { class: 'f-label', text: 'Send it as a link anyone can open' }),
    el('p', { style: 'margin:0 0 12px', text: 'This packs every photo, message and the music into one .html file. Put it online for free, then send them the link:' }),
    el('ol', { class: 'steps' },
      el('li', { text: 'Download the page below.' }),
      el('li', { text: 'On GitHub, create a new public repository and upload the file, renamed to index.html.' }),
      el('li', { text: 'In the repository: Settings → Pages → deploy from the main branch. GitHub gives you a link to send.' })),
    el('div', { style: 'margin-top:14px' }, btn), status,
    el('p', { class: 'f-hint', text: 'If you change anything later, download again and replace the file. Envelopes unlock by the date on their device.' })));
  if (store.kind === 'cloud'){
    box.appendChild(el('div', { class: 'ed-card', style: 'padding-bottom:16px' },
      el('span', { class: 'f-label', text: 'Or share this page' }),
      el('p', { style: 'margin:0', text: 'You can also share this page from Claude’s Share menu. They’ll need to be signed in to Claude to open it, so the download above is the easier option for most people.' })));
  }
}

async function downloadPage(btn, status){
  btn.disabled = true; status.textContent = 'Packing everything up…';
  try {
    if (store.flush) await store.flush();
    var html = await buildStandalone(function(t){ status.textContent = t; });
    var name = 'happy-birthday' + (S.config.toName ? '-' + S.config.toName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') : '') + '.html';
    var blob = new Blob([html], { type: 'text/html' });
    if (store.downloads){
      await store.downloads.save({ filename: name, data: blob });
      status.textContent = 'Saved ' + name + ' (' + fmtBytes(blob.size) + ').';
    } else {
      var url = URL.createObjectURL(blob), a = el('a', { href: url, download: name });
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      status.textContent = 'Downloaded ' + name + ' (' + fmtBytes(blob.size) + ').';
    }
  } catch (e) {
    console.warn(e);
    status.textContent = e && e.code === 'declined' ? 'Download cancelled.' : (e && e.code === 'rate_limited' ? 'Please wait a moment and try again.' : 'Couldn’t build the page: ' + errMsg(e));
  }
  btn.disabled = false;
}
async function buildStandalone(progress){
  var data = clone(S), missing = 0, total = 0, done = 0;
  async function conv(ref){
    if (!ref) return null; total++;
    try { var r = await store.imageDataURL(ref); done++; progress('Packing photos… ' + done); return r; }
    catch (e) { missing++; return null; }
  }
  data.config.heroPhoto = await conv(data.config.heroPhoto);
  for (var i = 0; i < data.days.length; i++) data.days[i].photo = await conv(data.days[i].photo);
  for (var j = 0; j < data.memories.length; j++) data.memories[j].photo = await conv(data.memories[j].photo);
  var mu = data.config.music;
  if (mu.kind === 'upload' && mu.ref){
    progress('Packing the song…');
    try { mu.ref = await store.audioDataURL(mu); } catch (e) { mu.kind = 'musicbox'; mu.ref = null; missing++; }
  } else mu.ref = null;
  var json = JSON.stringify(data).replace(/</g, '\\u003c').split(String.fromCharCode(0x2028)).join('\\u2028').split(String.fromCharCode(0x2029)).join('\\u2029');
  var esc = function(s){ return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
  var title = esc(S.config.toName ? 'For ' + S.config.toName + ' ♡' : 'A birthday surprise ♡');
  var css = document.getElementById('app-css').textContent;
  var js = document.getElementById('app-js').textContent;
  var fonts = document.querySelector('link[href*="fonts.googleapis.com/css2"]');
  if (missing) progress(missing + ' item(s) couldn’t be packed and were left out.');
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<meta name="theme-color" content="#fdeef1">\n<title>' + title + '</title>\n' +
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
    '<link href="' + esc(fonts ? fonts.getAttribute('href') : '') + '" rel="stylesheet">\n' +
    '<style id="app-css">' + css + '</style>\n</head>\n<body>\n' +
    '<script>window.BDAY_DATA=' + json + ';<\/script>\n' +
    '<script id="app-js">' + js + '<\/script>\n</body>\n</html>\n';
}

/* ================= boot ================= */
function showCenter(title, text, extra){
  root.innerHTML = '';
  root.appendChild(el('div', { class: 'center-msg' }, el('div', { class: 'beat', html: ICON.heart }), el('h1', { text: title }), text ? el('p', { text: text }) : null, extra || null));
}
async function boot(){
  showCenter('Wrapping your surprise…', '');
  try { store = await pickStore(); } catch (e) { store = null; }
  if (!store){ showCenter('This surprise can’t open here', 'It needs you to be signed in to Claude. If someone sent it to you, ask them for the downloadable version ♡'); return; }
  try { S = normalize(await store.load()); }
  catch (e) {
    console.warn('load failed', e);
    showCenter('Couldn’t reach the surprise', 'The connection seems slow right now.', el('button', { class: 'btn primary', type: 'button', text: 'Try again', style: 'margin-top:14px', onclick: boot }));
    return;
  }
  var qd = parseDay(parseFlexDate(QS.get('date')));
  if (qd && store.kind !== 'cloud') simOffset = new Date(qd.getFullYear(), qd.getMonth(), qd.getDate(), 12, 0, 0).getTime() - Date.now();
  if (store.canEdit && !$('.owner-bar')){ document.body.classList.add('is-owner'); renderOwnerBar(); }
  onSaveState(0, null);
  Music.prepare();
  renderRecipient();
  if (store.canEdit && !S.config.birthday && !S.days.length && !S.memories.length) openEditor();
}
window.addEventListener('pagehide', function(){ if (store && store.flush) store.flush(); });
document.addEventListener('error', function(e){
  var t = e.target, s = t && t.tagName === 'IMG' ? t.getAttribute('src') || '' : '';
  if (/^images\//.test(s) && !t.getAttribute('data-root-tried')){ t.setAttribute('data-root-tried', '1'); t.setAttribute('src', s.replace(/^images\//, '')); }
}, true);
document.addEventListener('visibilitychange', function(){ if (document.hidden && store && store.flush) store.flush(); });
boot();
})();
</script>
